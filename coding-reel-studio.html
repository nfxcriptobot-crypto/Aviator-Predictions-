<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coding Reel Studio</title>
<style>
:root{--bg:#0f1117;--card:#181b24;--line:#2a2f3d;--tx:#e8eaf0;--mu:#8b92a5;--ac:#7c5cff;--rec:#ff3b5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5f9;--card:#fff;--line:#dfe2ec;--tx:#171a24;--mu:#666d82}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.page{display:none;height:100%;flex-direction:column}
.page.on{display:flex}
.wrap{max-width:720px;width:100%;margin:0 auto;padding:20px 16px;overflow:auto;flex:1}
h1{font-size:24px;margin-bottom:4px}
.sub{color:var(--mu);font-size:14px;margin-bottom:20px}
.btn{background:var(--ac);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600}
.btn.big{width:100%;padding:16px;font-size:17px;margin-bottom:20px}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.proj{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.proj .i{flex:1;text-align:left}
.proj b{display:block}
.proj small{color:var(--mu)}
.del{color:var(--rec);padding:6px 10px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:420px}
.box h2{font-size:19px;margin-bottom:14px}
label.l{display:block;font-size:13px;color:var(--mu);margin:12px 0 6px}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.opt{display:flex;gap:10px}
.opt label{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-size:14px}
.opt input{display:none}
.opt input:checked+span{color:var(--ac);font-weight:700}
.opt label:has(input:checked){border-color:var(--ac);background:#7c5cff22}
.row{display:flex;gap:10px;margin-top:18px}
.row .btn{flex:1}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.top .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{padding:8px 10px;border-radius:10px;background:var(--bg)}
.rec{background:var(--rec);color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;display:flex;align-items:center;gap:6px}
.rec i{width:10px;height:10px;border-radius:50%;background:#fff}
.tabs{display:none;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px;color:var(--mu)}
.tabs button.on{color:var(--ac);border-bottom:2px solid var(--ac);font-weight:700}
.ws{flex:1;display:flex;min-height:0}
.code,.prev{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.ftabs{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.ftabs button{padding:6px 14px;border-radius:8px;background:var(--card);color:var(--mu);font-size:13px;font-weight:600}
.ftabs button.on{background:var(--ac);color:#fff}
textarea{flex:1;width:100%;resize:none;border:0;outline:0;padding:12px;background:var(--bg);color:var(--tx);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;tab-size:2;white-space:pre}
.prev{border-left:1px solid var(--line);background:#fff}
iframe{flex:1;border:0;width:100%;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:12px 18px;border-radius:12px;display:none;z-index:20}
.toast.on{display:block}
@media (max-width:760px){
.tabs{display:flex}
.ws{flex-direction:column}
.code,.prev{display:none}
.ws[data-v="code"] .code{display:flex}
.ws[data-v="prev"] .prev{display:flex}
.prev{border-left:0}
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.chips .on{border-color:var(--ac);background:#7c5cff22;color:var(--ac);font-weight:700}
.pbar{padding:12px 16px}
#stage{position:relative;background:radial-gradient(circle at 50% 25%,#2b3050,#0d0e12 75%);color:#ccc}
.pvA{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
.pv{background:#fff;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 10px 40px #0008;border-radius:12px;flex:none}
.pv iframe{flex:1;border:0;width:100%;background:#fff}
.s-ph{border-radius:30px;border:6px solid #111}
.s-ph:before{content:"";position:absolute;top:6px;left:50%;width:30%;height:14px;background:#111;border-radius:10px;transform:translateX(-50%);z-index:2}
.bb{display:none;height:28px;flex:none;background:#2d2d30;align-items:center;gap:6px;padding:0 10px}
.s-br .bb{display:flex}
.bb i{width:9px;height:9px;border-radius:50%}
.bb span{flex:1;margin-left:8px;background:#1e1e1e;border-radius:6px;height:16px;font-size:10px;color:#888;padding:0 8px;line-height:16px}
.vs{height:40%;flex:none;display:flex;flex-direction:column;background:#1e1e1e;border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 -6px 24px #0008}
.vtabs{height:30px;flex:none;background:#252526;display:flex}
.vtabs span{padding:0 14px;line-height:30px;font-size:12px;color:#999}
.vtabs span.on{background:#1e1e1e;color:#fff;border-top:1px solid #7c5cff}
.vb{flex:1;min-height:0;display:flex;overflow:hidden;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace}
.lns{padding:8px 8px 8px 10px;color:#6e7681;text-align:right;white-space:pre}
#vcode{flex:1;margin:0;padding:8px 0;white-space:pre;color:#d4d4d4;font:inherit}
.cur{display:inline-block;width:2px;height:1.1em;background:#fff;vertical-align:text-bottom;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.ov{position:absolute;inset:0;background:#0d0e12;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#ov .box{color:var(--tx)}
#xBtn{position:absolute;top:0;right:0;z-index:8;display:none;width:56px;height:56px;opacity:0}
#stopBtn{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:8;display:none;background:#000a;color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;opacity:.5}
#sfr2{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0d0e12}
#stage{position:fixed;inset:0;z-index:30}
</style>
</head>
<body>

<section class="page on" id="home">
  <div class="wrap">
    <h1>🎬 Coding Reel Studio</h1>
    <p class="sub">কোডিং ও প্রিভিউ রিলস বানানোর জায়গা</p>
    <button class="btn big" id="addBtn">+ Add Project</button>
    <div id="list"></div>
  </div>
</section>

<section class="page" id="work">
  <div class="top">
    <button class="back" id="backBtn">←</button>
    <div class="t" id="wTitle"></div>
    <button class="rec" id="recBtn"><i></i>Record</button>
  </div>
  <div class="tabs"><button data-t="code" class="on">কোড</button><button data-t="prev">প্রিভিউ</button></div>
  <div class="ws" id="ws" data-v="code">
    <div class="code">
      <div class="ftabs" id="ftabs"></div>
      <textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="এখানে কোড পেস্ট করো..."></textarea>
    </div>
    <div class="prev"><iframe id="fr" sandbox="allow-scripts allow-modals"></iframe></div>
  </div>
</section>

<section class="page" id="setup">
  <div class="top"><button class="back" id="sBack">←</button><div class="t">Record Settings</div></div>
  <div class="wrap">
    <label class="l">প্রিভিউ স্ক্রিন</label><div class="chips" id="cScr"></div>
    <label class="l">টাইপিং স্পিড</label><div class="chips" id="cSpd"></div>
    <label class="l">কী টাইপ হবে</label><div class="chips" id="cMode"></div>
    <p class="sub" id="hint" style="margin-top:14px"></p>
  </div>
  <div class="pbar"><button class="btn big" id="playBtn" style="margin:0">▶ Play</button></div>
</section>

<section class="page" id="stage">
  <iframe id="sfr2" sandbox="allow-scripts allow-modals" allow="fullscreen"></iframe>
  <button id="xBtn"></button>
  <button id="stopBtn"></button>
  <div class="ov" id="ov"></div>
</section>

<div class="modal" id="modal">
  <div class="box">
    <h2>নতুন প্রজেক্ট</h2>
    <label class="l">Project Name</label>
    <input type="text" id="pname" placeholder="যেমন: Login Card">
    <label class="l">ফাইল টাইপ</label>
    <div class="opt">
      <label><input type="radio" name="ft" value="html" checked><span>শুধু HTML</span></label>
      <label><input type="radio" name="ft" value="all"><span>HTML + CSS + JS</span></label>
    </div>
    <div class="row">
      <button class="btn ghost" id="cancel">বাতিল</button>
      <button class="btn" id="create">তৈরি করো</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var KEY='crs_projects_v1', projects=[], cur=null, curFile='html';
try{projects=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){projects=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(projects))}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2200)}
function show(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on')});$(id).classList.add('on')}

function render(){
  var l=$('list');
  if(!projects.length){l.innerHTML='<div class="empty">কোনো প্রজেক্ট নেই।<br>উপরে Add Project চাপো।</div>';return}
  l.innerHTML=projects.map(function(p){
    return '<div class="proj"><button class="i" data-o="'+p.id+'"><b>'+esc(p.name)+'</b><small>'+(p.type==='all'?'HTML + CSS + JS':'শুধু HTML')+'</small></button><button class="del" data-d="'+p.id+'">মুছো</button></div>'
  }).join('');
}
$('list').addEventListener('click',function(e){
  var o=e.target.closest('[data-o]'),d=e.target.closest('[data-d]');
  if(o){open(o.dataset.o)}
  else if(d&&confirm('প্রজেক্টটি মুছে ফেলবে?')){projects=projects.filter(function(p){return p.id!==d.dataset.d});save();render()}
});

$('addBtn').onclick=function(){$('pname').value='';$('modal').classList.add('on');setTimeout(function(){$('pname').focus()},50)};
$('cancel').onclick=function(){$('modal').classList.remove('on')};
$('create').onclick=function(){
  var n=$('pname').value.trim();
  if(!n){toast('প্রজেক্টের নাম দাও');return}
  var t=document.querySelector('input[name=ft]:checked').value;
  var p={id:'p'+Date.now(),name:n,type:t,html:'',css:'',js:''};
  projects.unshift(p);save();render();
  $('modal').classList.remove('on');open(p.id);
};

function open(id){
  cur=projects.filter(function(p){return p.id===id})[0];if(!cur)return;
  $('wTitle').textContent=cur.name;
  var f=cur.type==='all'?['html','css','js']:['html'];
  $('ftabs').innerHTML=f.map(function(x){return '<button data-f="'+x+'">'+x.toUpperCase()+'</button>'}).join('');
  $('ftabs').style.display=f.length>1?'flex':'none';
  pick('html');setView('code');show('work');preview();
}
function pick(f){
  curFile=f;$('ed').value=cur[f]||'';
  document.querySelectorAll('#ftabs button').forEach(function(b){b.classList.toggle('on',b.dataset.f===f)});
}
$('ftabs').addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(b)pick(b.dataset.f)});

var tm;
$('ed').addEventListener('input',function(){
  cur[curFile]=this.value;clearTimeout(tm);
  tm=setTimeout(function(){save();preview()},350);
});
$('ed').addEventListener('keydown',function(e){
  if(e.key==='Tab'){e.preventDefault();var s=this.selectionStart;this.value=this.value.slice(0,s)+'  '+this.value.slice(this.selectionEnd);this.selectionStart=this.selectionEnd=s+2;this.dispatchEvent(new Event('input'))}
});

function build(){
  var h=cur.html||'';
  if(cur.type!=='all')return h;
  var st='<style>'+(cur.css||'')+'</style>',sc='<script>'+(cur.js||'')+'<\/script>';
  h=/<\/head>/i.test(h)?h.replace(/<\/head>/i,st+'</head>'):st+h;
  h=/<\/body>/i.test(h)?h.replace(/<\/body>/i,sc+'</body>'):h+sc;
  return h;
}
function preview(){if(cur)$('fr').srcdoc=build()}

function setView(v){
  $('ws').dataset.v=v;
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===v)});
}
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(b)setView(b.dataset.t)});

$('backBtn').onclick=function(){save();render();show('home')};
$('recBtn').onclick=function(){openSetup()};
var SC=[['11','1:1'],['34','3:4'],['ph','Phone'],['br','Browser Window'],['free','Free Size']],
RT={'11':1,'34':.75,'ph':9/19,'br':16/11},CPS={1:18,2:36,3:60,4:90,5:140},
FN={html:'index.html',css:'style.css',js:'script.js'},
HINT={html:'CSS ও JS আগে থেকেই বসানো থাকবে। শুধু HTML টাইপ হবে আর প্রিভিউ সাথে সাথে বদলাবে।',css:'HTML ও JS আগে থেকেই থাকবে। CSS টাইপ হওয়ার সাথে সাথে প্রিভিউ সাজবে।',all:'HTML, তারপর CSS, তারপর JS — একটার পর একটা টাইপ হবে আর প্রিভিউ লাইভ তৈরি হবে।'};
var shown,seq,idx,pos,run=false,acc,last,wait,lastPv,rec=null,chunks=[],stream=null;
function chips(id,arr,k){
  $(id).innerHTML=arr.map(function(a){return '<button data-v="'+a[0]+'" class="'+(String(cur.rec[k])===String(a[0])?'on':'')+'">'+a[1]+'</button>'}).join('');
  $(id).onclick=function(e){var b=e.target.closest('[data-v]');if(!b)return;cur.rec[k]=k==='spd'?+b.dataset.v:b.dataset.v;save();chips(id,arr,k);$('hint').textContent=HINT[cur.rec.mode]}
}
function openSetup(){
  if(!cur.rec)cur.rec={scr:'ph',spd:2,mode:'html'};
  var all=cur.type==='all';if(!all)cur.rec.mode='html';
  chips('cScr',SC,'scr');
  chips('cSpd',[1,2,3,4,5].map(function(n){return[n,n+'×']}),'spd');
  chips('cMode',all?[['html','শুধু HTML'],['css','শুধু CSS'],['all','HTML + CSS + JS']]:[['html','শুধু HTML']],'mode');
  $('hint').textContent=HINT[cur.rec.mode];show('setup');
}
$('sBack').onclick=function(){show('work')};
$('playBtn').onclick=function(){
  var m=cur.rec.mode,ok=m==='html'?cur.html:m==='css'?cur.css:(cur.html||cur.css||cur.js);
  if(!ok){toast('আগে ওই ফাইলে কোড পেস্ট করো');return}
  show('stage');fsEnter();prep();ovStart();
};
